service:
  name: Ollama Demo
  identifier: ollama_demo
  orgIdentifier: acme_corp
  projectIdentifier: platform_services
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: k8s_manifests
            type: K8sManifest
            spec:
              store:
                type: HarnessCode
                spec:
                  repoName: ollama_demo
                  gitFetchType: Branch
                  paths:
                    - k8s
                  branch: main
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: dockerhub
          sources:
            - identifier: dockerhub
              spec:
                connectorRef: org.dockerhub
                imagePath: carolanio/harness-demo
                tag: <+input>
              type: DockerRegistry