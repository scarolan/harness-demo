pipeline:
  name: Ollama Demo
  identifier: ollama_demo
  projectIdentifier: harness_demo_seanc
  orgIdentifier: sandbox
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: harness-demo
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_local
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: GitHub Status Pending
                  identifier: GitHub_Status_Pending
                  spec:
                    connectorRef: dockerhub
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      python3 scripts/github_status.py
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_pat")>
                      GITHUB_REPO: scarolan/harness-demo
                      STATUS_STATE: pending
                      STATUS_CONTEXT: harness/ai-code-review
                      STATUS_DESC: AI security review in progress...
                      TARGET_URL: <+pipeline.execution.url>
                      PR_NUMBER: <+codebase.prNumber>
                      COMMIT_SHA: <+codebase.commitSha>
                    resources:
                      limits:
                        memory: 256Mi
                        cpu: 200m
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: Run
                  name: AI Code Review
                  identifier: AI_Code_Review
                  spec:
                    connectorRef: dockerhub
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      apt-get update && apt-get install -y --no-install-recommends git curl >/dev/null
                      pip install --no-cache-dir --quiet requests
                      git config --global --add safe.directory /harness
                      git config --global --add safe.directory '*'
                      git fetch --depth=50 origin main || true
                      DIFF_FILES=$(git diff --name-only origin/main -- app/ 2>/dev/null | wc -l)
                      echo "Diff vs origin/main: $DIFF_FILES file(s) changed under app/"
                      python3 scripts/ai_review.py
                      # Export /tmp/review/* as step env for Harness output variables
                      for f in /tmp/review/*; do
                        [ -f "$f" ] || continue
                        name=$(basename "$f")
                        export "$name"="$(cat "$f")"
                        echo "$name=$(cat "$f")"
                      done
                    envVariables:
                      # In a CI pod "localhost" is the pod, not the host where Ollama runs.
                      OLLAMA_URL: http://host.docker.internal:11434
                      OLLAMA_MODEL: gemma4:26b
                    outputVariables:
                      - name: REVIEW_VERDICT
                        type: String
                        value: REVIEW_VERDICT
                      - name: REVIEW_MODEL
                        type: String
                        value: REVIEW_MODEL
                      - name: REVIEW_TOKENS
                        type: String
                        value: REVIEW_TOKENS
                      - name: REVIEW_TIME
                        type: String
                        value: REVIEW_TIME
                      - name: REVIEW_FILES
                        type: String
                        value: REVIEW_FILES
                      - name: CRITICAL_COUNT
                        type: String
                        value: CRITICAL_COUNT
                      - name: WARNING_COUNT
                        type: String
                        value: WARNING_COUNT
                      - name: CRITICAL_FINDINGS
                        type: String
                        value: CRITICAL_FINDINGS
                      - name: WARNING_FINDINGS
                        type: String
                        value: WARNING_FINDINGS
                    resources:
                      limits:
                        memory: 512Mi
                        cpu: 500m
                  timeout: 5m
                  failureStrategies: []
              - step:
                  type: Run
                  name: Security Gate
                  identifier: Security_Gate
                  spec:
                    connectorRef: dockerhub
                    image: alpine:3.20
                    shell: Sh
                    command: |-
                      export VERDICT="<+execution.steps.AI_Code_Review.output.outputVariables.REVIEW_VERDICT>"
                      export CRITICAL_COUNT="<+execution.steps.AI_Code_Review.output.outputVariables.CRITICAL_COUNT>"
                      export WARNING_COUNT="<+execution.steps.AI_Code_Review.output.outputVariables.WARNING_COUNT>"
                      export CRITICAL_FINDINGS="<+execution.steps.AI_Code_Review.output.outputVariables.CRITICAL_FINDINGS>"
                      export WARNING_FINDINGS="<+execution.steps.AI_Code_Review.output.outputVariables.WARNING_FINDINGS>"
                      export REVIEW_MODEL="<+execution.steps.AI_Code_Review.output.outputVariables.REVIEW_MODEL>"

                      echo "============================================================"
                      echo "SECURITY GATE"
                      echo "============================================================"
                      echo "AI verdict     : $VERDICT"
                      echo "Model          : $REVIEW_MODEL"
                      echo "Critical count : $CRITICAL_COUNT"
                      echo "Warning count  : $WARNING_COUNT"
                      [ -n "$CRITICAL_FINDINGS" ] && [ "$CRITICAL_FINDINGS" != "None" ] && \
                        echo "Critical       : $CRITICAL_FINDINGS"
                      [ -n "$WARNING_FINDINGS" ] && [ "$WARNING_FINDINGS" != "None" ] && \
                        echo "Warnings       : $WARNING_FINDINGS"
                      echo "============================================================"

                      if [ "$VERDICT" = "BLOCKED" ]; then
                        export GATE_DECISION="BLOCKED"
                        export GATE_REASON="$CRITICAL_COUNT critical finding(s): $CRITICAL_FINDINGS"
                        echo "SECURITY GATE FAILED — $GATE_REASON"
                        exit 1
                      fi

                      export GATE_DECISION="PASSED"
                      if [ "$VERDICT" = "PASSED_WITH_WARNINGS" ]; then
                        export GATE_REASON="$WARNING_COUNT warning(s), no criticals — allowing"
                      elif [ "$VERDICT" = "APPROVED" ]; then
                        export GATE_REASON="Clean review — no findings"
                      else
                        export GATE_REASON="$VERDICT — no criticals"
                      fi
                      echo "SECURITY GATE PASSED — $GATE_REASON"
                    outputVariables:
                      - name: GATE_DECISION
                        type: String
                        value: GATE_DECISION
                      - name: GATE_REASON
                        type: String
                        value: GATE_REASON
                      - name: CRITICAL_COUNT
                        type: String
                        value: CRITICAL_COUNT
                      - name: WARNING_COUNT
                        type: String
                        value: WARNING_COUNT
                    resources:
                      limits:
                        memory: 128Mi
                        cpu: 100m
                  timeout: 2m
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    connectorRef: dockerhub
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      pip install --no-cache-dir -q -r requirements.txt pytest
                      pytest -v tests/
                    resources:
                      limits:
                        memory: 512Mi
                        cpu: 500m
                  timeout: 5m
              - step:
                  type: Template
                  name: Build and Push Image
                  identifier: Build_and_Push_Image
                  template:
                    templateRef: docker_build_push
                    versionLabel: v1
                    templateInputs:
                      type: BuildAndPushDockerRegistry
                      spec:
                        connectorRef: dockerhub
                        repo: carolanio/harness-demo
                        tags:
                          - <+codebase.shortCommitSha>
                        dockerfile: Dockerfile
                        context: .
              - step:
                  type: Run
                  name: GitHub Status Report
                  identifier: GitHub_Status_Report
                  spec:
                    connectorRef: dockerhub
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      # AI_Code_Review succeeds even when it blocks, so its verdict is
                      # always readable here — unlike the gate, which exits non-zero.
                      VERDICT="<+execution.steps.AI_Code_Review.output.outputVariables.REVIEW_VERDICT>"
                      CRITICAL="<+execution.steps.AI_Code_Review.output.outputVariables.CRITICAL_COUNT>"
                      FINDINGS="<+execution.steps.AI_Code_Review.output.outputVariables.CRITICAL_FINDINGS>"

                      case "$VERDICT" in
                        BLOCKED)
                          export STATUS_STATE=failure
                          export STATUS_DESC="BLOCKED - $CRITICAL critical: $FINDINGS"
                          ;;
                        APPROVED|PASSED_WITH_WARNINGS)
                          export STATUS_STATE=success
                          export STATUS_DESC="$VERDICT - no critical findings"
                          ;;
                        *)
                          # Unresolved expression or an early failure before the review ran.
                          export STATUS_STATE=error
                          export STATUS_DESC="AI review did not complete"
                          ;;
                      esac

                      python3 scripts/github_status.py
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_pat")>
                      GITHUB_REPO: scarolan/harness-demo
                      STATUS_CONTEXT: harness/ai-code-review
                      TARGET_URL: <+pipeline.execution.url>
                      PR_NUMBER: <+codebase.prNumber>
                      COMMIT_SHA: <+codebase.commitSha>
                    resources:
                      limits:
                        memory: 256Mi
                        cpu: 200m
                  timeout: 2m
                  when:
                    stageStatus: All
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
    - stage:
        name: Deploy to Dev
        identifier: Deploy_to_Dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: ollama_demo
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: dockerhub
                      sources:
                        - identifier: dockerhub
                          type: DockerRegistry
                          spec:
                            tag: <+codebase.shortCommitSha>
          environment:
            environmentRef: dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: rancher_desktop
          execution:
            steps:
              - step:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  type: K8sCanaryDeploy
                  timeout: 10m
                  spec:
                    instanceSelection:
                      type: Count
                      spec:
                        count: 1
                    skipDryRun: false
              - step:
                  name: Canary Delete
                  identifier: canaryDelete
                  type: K8sCanaryDelete
                  timeout: 5m
                  spec: {}
              - step:
                  name: Rolling Deployment
                  identifier: rollingDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 5m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        when:
          pipelineStatus: Success
          # PR builds validate only — deploying an unmerged branch would leave dev
          # running code from a PR that may never merge.
          condition: <+codebase.build.type> == "branch" && <+codebase.branch> == "main"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
